name: Build Shirokai Holograms
on:
  push:
    paths: ['shirokai-holograms/**', '.github/workflows/holograms-build.yml']
  pull_request:
    paths: ['shirokai-holograms/**', '.github/workflows/holograms-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shirokai-holograms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon build smokeClasses
      - uses: actions/upload-artifact@v4
        with:
          name: shirokai-holograms-dev
          path: shirokai-holograms/build/libs/*.jar
          if-no-files-found: error
